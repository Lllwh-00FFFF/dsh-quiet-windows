name: release

# 推一个 v* tag 就发版；也可以手动点运行。
# 发布走 npm 的 Trusted Publishing（OIDC）：不存任何 NPM_TOKEN。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'

      # 可信发布要求 npm CLI >= 11.5.1，Node 22.14 自带的还是 10.x
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest && npm --version

      # 防止 tag 和 package.json 版本不一致：v0.2.3 只能发 0.2.3
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package=$pkg"
          [ "$tag" = "$pkg" ] || { echo "::error::tag $tag does not match package.json $pkg"; exit 1; }

      - name: Publish to npm
        run: npm publish --provenance --access public
